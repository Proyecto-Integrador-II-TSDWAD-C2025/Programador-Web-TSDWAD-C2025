<section class="registro-page">
  <div class="registro-card">
    <h1>Crear cuenta</h1>
    <p>Registrate para comenzar con tu plan personalizado en NutriApp.</p>

    <form>
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input id="nombre" type="text" placeholder="Ej: Pablo Romero">
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" placeholder="Ej: usuario@email.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="Ingresá una contraseña">
      </div>

      <a routerLink="/perfil" class="btn-registro">
        Crear cuenta
      </a>
    </form>

    <p class="login-text">
      ¿Ya tenés cuenta?
      <a routerLink="/login">Iniciar sesión</a>
    </p>
  </div>
</section>
